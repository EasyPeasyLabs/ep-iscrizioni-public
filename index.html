<!DOCTYPE html>
<html lang="it" class="fixed inset-0 w-full h-full overflow-hidden">
  <head>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color:red; background:white; z-index:9999; position:absolute; top:0; left:0; width:100%; height:100%; overflow:auto; padding: 20px;"><h1>ERROR</h1><pre>' + e.error?.stack + '\n' + e.message + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:red; background:white; z-index:9999; position:absolute; top:0; left:0; width:100%; height:100%; overflow:auto; padding: 20px;"><h1>PROMISE REJECTION</h1><pre>' + e.reason + '</pre></div>';
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, interactive-widget=resizes-content" />
    <title>EP Public - Iscrizioni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Pacifico&family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

</head>
  <body class="bg-slate-50 text-slate-800 antialiased fixed inset-0 w-full h-full overflow-hidden">
    <div id="root" class="w-full h-full overflow-hidden flex flex-col"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
